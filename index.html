<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WitchSec — Luau Obfuscator</title>
  <meta name="description" content="WitchSec — Luau obfuscator. Runs entirely in your browser.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="brand">
    <div class="logo">✦ WitchSec</div>
    <p class="tagline">Luau obfuscator. Runs entirely in your browser.</p>
  </header>

  <main>
    <section class="block">
      <div class="block-head">
        <span class="label">Source</span>
        <div class="btns">
          <button id="btn-upload" class="btn-tiny">Upload</button>
          <button id="btn-example" class="btn-tiny">Example</button>
          <button id="btn-clear-src" class="btn-tiny">Clear</button>
        </div>
        <input id="file-input" type="file" accept=".lua,.luau,.txt,text/plain" hidden>
      </div>
      <textarea id="source" class="code" spellcheck="false" placeholder="Write or paste Luau code here..."></textarea>
      <div class="block-foot"><span id="src-stats"></span></div>
    </section>

    <section class="controls">
      <div class="seed-row">
        <label>Seed <input id="seed" type="number" min="0" placeholder="random"></label>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="opt-str" checked> Strings</label>
        <label><input type="checkbox" id="opt-com" checked> Comments</label>
        <label><input type="checkbox" id="opt-num" checked> Numbers</label>
        <label><input type="checkbox" id="opt-loc" checked> Locals</label>
        <label><input type="checkbox" id="opt-junk" checked> Junk</label>
      </div>
      <button id="btn-obf" class="btn-main" disabled>Obfuscate</button>
    </section>

    <section class="block" id="output-block" hidden>
      <div class="block-head">
        <span class="label">Output</span>
        <div class="btns">
          <button id="btn-download" class="btn-tiny btn-accent">Download</button>
          <button id="btn-copy" class="btn-tiny">Copy</button>
        </div>
      </div>
      <textarea id="output" class="code" readonly spellcheck="false"></textarea>
      <div class="block-foot"><span id="out-stats"></span></div>
    </section>
  </main>

  <footer><p>WitchSec v1.0 — code protection tool.</p></footer>

  <script src="assets/obfuscator.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
